name: "CI"
run-name: "CI"

on:
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  test:
    name: "build and test"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn clean package --batch-mode --settings ./.mvn/settings.xml
